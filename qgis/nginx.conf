server {
    # default_server keeps this the catch-all for any Host header.
    # server_name must be the public host: fastcgi_params sets
    # SERVER_NAME $server_name, and QGIS builds its /wfs3 links from it.
    listen 80 default_server;
    server_name gis.showmefire.org;

    location /qgis-server {
        # Public read-only map service: allow browser clients (ArcGIS Online,
        # web maps) to call it directly instead of via a server-side proxy.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        include fastcgi_params;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/qgis_mapserv.fcgi;
        fastcgi_param SCRIPT_NAME /qgis-server/qgis_mapserv.fcgi;
        fastcgi_param SERVER_PORT $server_port;
        # Public traffic arrives over HTTPS (Cloudflare), so /wfs3 links
        # should be https:// URLs.
        fastcgi_param HTTPS on;
        fastcgi_pass qgis-server:9993;
    }
}
