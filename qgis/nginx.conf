server {
    listen 80;
    server_name _;

    location /qgis-server {
        # Public read-only map service: allow browser clients (ArcGIS Online,
        # web maps) to call it directly instead of via a server-side proxy.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        include fastcgi_params;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/qgis_mapserv.fcgi;
        fastcgi_param SCRIPT_NAME /qgis-server/qgis_mapserv.fcgi;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        # Public URL, so the OGC API - Features (/wfs3) links QGIS generates
        # point at https://gis.showmefire.org instead of http://_ .
        # The client's own Host header (a duplicate HTTP_HOST) would win over
        # this one, so don't forward client headers to QGIS.
        fastcgi_pass_request_headers off;
        fastcgi_param HTTP_HOST gis.showmefire.org;
        fastcgi_param HTTPS on;
        fastcgi_pass qgis-server:9993;
    }
}
